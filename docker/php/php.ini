; Application runtime limits
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000

; Timezone
date.timezone = UTC

; Error handling (overridden further by Laravel's own error reporting in production)
display_errors = Off
log_errors = On

; OPcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1
