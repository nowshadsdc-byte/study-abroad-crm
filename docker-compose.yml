name: confidenceglobalbd

x-app: &app
    build:
        context: .
        dockerfile: Dockerfile
        target: app
    image: confidenceglobalbd-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
        - .env
    environment: &app-environment
        DB_CONNECTION: mysql
        DB_HOST: mysql
        DB_PORT: 3306
        DB_DATABASE: ${DB_DATABASE:-confidenceglobalbd}
        DB_USERNAME: ${DB_USERNAME:-root}
        DB_PASSWORD: ${DB_PASSWORD:-password}
    volumes: &app-volumes
        - .:/var/www/html
        - vendor-data:/var/www/html/vendor
        - storage-data:/var/www/html/storage
        - bootstrap-cache-data:/var/www/html/bootstrap/cache
    depends_on:
        mysql:
            condition: service_healthy
    networks:
        - app-network

services:
    app:
        <<: *app

    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8000}:80"
        volumes:
            - .:/var/www/html
            - storage-data:/var/www/html/storage:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - app-network

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
            MYSQL_DATABASE: ${DB_DATABASE:-confidenceglobalbd}
        ports:
            - "${FORWARD_DB_PORT:-3307}:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-password}"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - app-network

    node:
        build:
            context: .
            dockerfile: Dockerfile
            target: node_tools
        image: confidenceglobalbd-node
        restart: unless-stopped
        working_dir: /var/www/html
        command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
        environment:
            VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
        ports:
            - "${VITE_PORT:-5173}:5173"
        volumes:
            - .:/var/www/html
            - node-modules-data:/var/www/html/node_modules
        networks:
            - app-network

    queue:
        <<: *app
        command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=3", "--sleep=3"]
        depends_on:
            mysql:
                condition: service_healthy
            app:
                condition: service_started

    scheduler:
        <<: *app
        command: ["php", "artisan", "schedule:work"]
        depends_on:
            mysql:
                condition: service_healthy
            app:
                condition: service_started

networks:
    app-network:
        driver: bridge

volumes:
    mysql-data:
    vendor-data:
    node-modules-data:
    storage-data:
    bootstrap-cache-data:
